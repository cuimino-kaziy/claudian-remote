name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked plugin dependencies
        run: npm ci --ignore-scripts
      - name: Verify publish-safe source boundary
        run: npm run check:source
      - name: Build and test plugin
        run: |
          npm run build
          node --check main.js
          npm test
      - name: Create isolated Python environment
        run: python3.12 -m venv .ci-venv
      - name: Install hash-locked Gateway dependencies
        run: .ci-venv/bin/pip install --require-hashes -r gateway/requirements.lock
      - name: Test Companion, Relay, and protocol
        run: .ci-venv/bin/python -m pytest gateway/tests -q
      - name: Test lifecycle contract and resume behavior
        run: .ci-venv/bin/python -m pytest installer/tests -q
      - name: Build and inspect unsigned release assets
        run: sh release/packaging/build-assets.sh --assets-only
