name: Release

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Reject a mutable or mismatched release ref
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
          release_channel=community
          case "${RELEASE_TAG}" in v*) release_channel=private_beta ;; esac
          export CLAUDIAN_RELEASE_CHANNEL="${release_channel}"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { releaseTagForVersion } from './release/packaging/release-contract.mjs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== releaseTagForVersion(version, process.env.CLAUDIAN_RELEASE_CHANNEL)) {
            throw new Error('Release tag does not match the version and channel');
          }
          JS
          printf '%s\n' "CLAUDIAN_RELEASE_CHANNEL=${release_channel}" >> "${GITHUB_ENV}"
      - name: Install and verify locked dependencies
        run: |
          npm ci --ignore-scripts
          python3.12 -m venv "${RUNNER_TEMP}/claudian-release-venv"
          "${RUNNER_TEMP}/claudian-release-venv/bin/pip" install --require-hashes -r gateway/requirements.lock
      - name: Run release gates
        run: |
          npm run check:source
          npm test
          npm run release:verify:runtimes
          "${RUNNER_TEMP}/claudian-release-venv/bin/python" -m pytest gateway/tests -q
          "${RUNNER_TEMP}/claudian-release-venv/bin/python" -m pytest installer/tests -q
      - name: Build exact-tag assets
        env:
          CLAUDIAN_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:package
      - name: Sign outside the repository and verify pinned trust root
        if: ${{ vars.CLAUDIAN_RELEASE_KEY_FINGERPRINT != '' }}
        env:
          CLAUDIAN_RELEASE_SIGNING_KEY_B64: ${{ secrets.CLAUDIAN_RELEASE_SIGNING_KEY_B64 }}
          CLAUDIAN_RELEASE_KEY_FINGERPRINT: ${{ vars.CLAUDIAN_RELEASE_KEY_FINGERPRINT }}
          CLAUDIAN_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run release:sign
          node release/packaging/verify-release.mjs
          npm run release:kit
      - name: Publish immutable GitHub Release assets
        if: ${{ vars.CLAUDIAN_RELEASE_KEY_FINGERPRINT != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          if [ "${CLAUDIAN_RELEASE_CHANNEL}" = private_beta ]; then
            set -- --prerelease
          elif [ "${CLAUDIAN_RELEASE_CHANNEL}" = community ]; then
            set -- "dist/CLAUDIAN_REMOTE_INSTALL_VERIFICATION-${GITHUB_REF_NAME}.md"
            test -f "$1"
          else
            exit 64
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/claudian-remote-legacy-retirement-helper-*.py \
            dist/main.js dist/manifest.json dist/styles.css dist/release-manifest.json \
            --verify-tag "$@" --title "Claudian Remote ${GITHUB_REF_NAME}" \
            --notes "Claudian Remote ${GITHUB_REF_NAME}. Plugin assets: main.js, manifest.json, styles.css. Mac services require the matching signed installation kit. Follow the repository installation and download verification guides."
